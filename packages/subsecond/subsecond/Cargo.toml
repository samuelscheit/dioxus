[package]
name = "subsecond"
edition = "2021"
version.workspace = true
authors = ["Jonathan Kelley"]
description = "A runtime hotpatching engine for Rust hot-reloading."
license = "MIT OR Apache-2.0"
repository = "https://github.com/DioxusLabs/dioxus/tree/main/packages/subsecond"
keywords = ["hotpatch", "engine", "subsecond", "dioxus", "hot-reload"]
readme = "../README.md"

[dependencies]
serde = { workspace = true, features = ["derive"] }
subsecond-types = { workspace = true }
thiserror = { workspace = true }

[features]
# Browser patch loader for wasm32 (fetches and instantiates the patch module through
# wasm-bindgen/js-sys/web-sys). Off by default so wasm32 binaries that never hot-patch do not link
# those crates; dioxus-devtools enables it for `dx serve` web builds.
wasm-patching = ["dep:web-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { workspace = true, optional = true, features = ["FetchEvent", "Request", "Window", "Response", "ResponseType", "console"] }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libloading = { workspace = true}
libc = { workspace = true}
memmap2 = { workspace = true}

[target.'cfg(target_os = "android")'.dependencies]
memfd = { workspace = true}
